# Editpad CI：test / release / clippy / fmt 全部阻断。
#
# fmt 已于 2026-09-25 转阻断：本机 `cargo fmt --all -- --check` 实测 **0 hunk**
# （分两批收敛：`editpad-core` 203 hunk / `editpad` 552 hunk，均为纯格式化独立
# 提交）。此前长期挂 `continue-on-error: true` 的原因是仓库有数百处手写紧凑写法
# （rustfmt.toml 只有 max_width=100，即默认风格），一次性全量重排会把功能改动
# 埋进噪声里。现在收敛完了，闸门关掉。
#
# clippy 用 `-D warnings`：Phase 0 已本地清零（rustfmt/clippy 组件已装齐）。
# 注意 channel = "stable" 漂移可能引入新 lint——届时按 CI 红修即可。

name: ci

on:
  push:
  pull_request:

# 连续推送时取消同一分支上尚未跑完的旧作业：依赖树（iced/syntect）编译
# 耗时占大头，排队跑已被取代的提交没有意义。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：所有作业都只读仓库（CI 不发布、不打 tag、不推任何东西），而
# GITHUB_TOKEN 的默认作用域是写——第三方 action（checkout / rust-toolchain /
# rust-cache / upload-artifact）因此也一并拿得到写权限。顶层显式收窄。
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # test 与 clippy 合一个作业（原先两个 windows 作业各编译一遍依赖树）。
  # 两个命令仍是独立步骤，红了看步骤名就能定位，不会因为输出混在一起难查。
  test-and-clippy:
    name: test + clippy (workspace)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # 缓存 target/ 与 cargo 注册表：全量编译 iced + syntect 是 CI 的
      # 主要耗时，无缓存时每次 push 都要重来一遍。
      - uses: Swatinem/rust-cache@v2
      # --locked：Cargo.lock 与清单不一致时直接失败。本仓带一处手工 vendor 补丁
      # （[patch.crates-io] iced_tiny_skia），补丁被解析器绕过时 cargo 只给一条
      # warning（P117/P119/P120 的选区残线/层栈修复会静默回归）——固定解析 +
      # 锁断言是唯一能提前发现的机制。本机 `cargo metadata --locked` 已验证
      # 锁与清单同步，加上它不会把 CI 弄红。
      - run: cargo test --locked --workspace
      # E-6：断言 vendor 补丁真的被命中。[patch.crates-io] 指向
      # vendor/iced_tiny_skia，命中时 Cargo.lock 里该包**没有** source 行；
      # 一旦解析走到上游（版本线前进 / 锁丢失后重解析），cargo 只输出一条
      # "patch not used" warning、作业照样绿——P117/P119/P120 修的选区残线与
      # 层栈只进不出会静默回归。正负两侧本机实测过：当前 lock 无 source 行
      # （断言放行），人为塞一行 source 即被检出（断言拦下）。
      - name: assert vendor patch is in effect
        shell: bash
        run: |
          if grep -A3 'name = "iced_tiny_skia"' Cargo.lock | grep -q '^source = '; then
            echo "::error::iced_tiny_skia 解析到了上游而非 vendor/ 补丁——渲染层修复会静默回归，请检查 Cargo.lock 与 [patch.crates-io]"
            exit 1
          fi
          echo "vendor iced_tiny_skia 补丁命中（lock 中无 source 行）"
      # 放在 test 之后：测试挂了先修测试，不必等 clippy。
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  release-build:
    name: release build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release --workspace
      # E-12 第④点：打包脚本此前从不在 CI 跑——它对版本资源的校验
      # （ProductName / FileVersion vs Cargo.toml 版本）与 `Resolve-Cargo`
      # 解析逻辑一次都没被执行过，资源注入回归只能等本地打包时才发现。
      # `-SkipBuild` 复用上面刚编好的 release exe；`-SkipCheck` 是因为 CI 的
      # HEAD 通常没有精确 tag（打 tag 是发布动作，由维护者本机决定），而
      # 本步要验的是**资源与打包管线**，不是可追溯性。
      - name: package (verify resources, no rebuild)
        shell: pwsh
        run: ./package.ps1 -SkipBuild -SkipCheck
      # D-4：把校验过的产物上传成 artifact（保留 14 天）。它不等于发行——
      # 清单里那行 `UNTAGGED` 会如实标出这次构建没打标。
      - uses: actions/upload-artifact@v7
        with:
          name: editpad-win64-ci
          path: |
            dist/Editpad-*-win64.zip
            dist/Editpad-*-sha256.txt
          if-no-files-found: error

  # E-12：rustdoc 死链关卡。本轮一次性清了 18 处（多为「公开文档链接到私有项」，
  # 另含 `Vec<PathBuf>` 被当成未闭合 HTML 标签、`[3,12]`/`[0]` 被当成链接），
  # 其中三处是本轮新写的注释——不设闸就会持续回长。本地同口径：
  #   RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps
  doc:
    name: rustdoc (-D warnings)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  fmt:
    name: fmt (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
