# Dependabot：定期开 `cargo update` PR。
#
# 为什么这个项目特别需要它：仓库带一处手工 vendor 补丁
# （`[patch.crates-io] iced_tiny_skia = { path = "vendor/iced_tiny_skia" }`），
# 而 fork 钉在 0.14.0、同族 `iced_widget` 已解析到 registry 的 0.14.2——上游版本线
# 在往前走。任何一次版本抬升都可能让补丁不再被命中，而 cargo 对此只输出一条
# "patch not used" **warning**：P117/P119/P120 修的「选区残线 + 层栈只进不出」会
# 静默回归。CI 里有两道闸（`--locked` 固定解析 + 断言 lock 中该包无 source 行），
# 但它们只在**已经有人动了锁**时才响；dependabot 是唯一能提前把「上游一涨就破」
# 这件事变成一条待审 PR 的机制。
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Asia/Shanghai"
    # 锁面依赖多（iced 一族互相牵动），一次开一屏 PR 只会淹没真信号。
    open-pull-requests-limit: 5
    # 同族版本一起升，减少「iced_widget 升了、iced_graphics 没升」这类半截升级。
    groups:
      iced:
        patterns:
          - "iced"
          - "iced_*"
    commit-message:
      prefix: deps
    labels:
      - dependencies

  # CI 自身用的 action 也在依赖树里：checkout / rust-toolchain / rust-cache /
  # upload-artifact 钉的是 major tag，不升就长期停在旧实现上。
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
    labels:
      - ci
