[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/imluyg/editpad"

[workspace.dependencies]
editpad-core = { path = "crates/core" }
ropey = "1.6"
encoding_rs = "0.8"
thiserror = "2"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"
# P70 正则查找/替换：fancy-regex（已在依赖树：syntect default-fancy）。
# 相比 regex 门面额外支持环视/反向引用（主流编辑器级能力）。
# 取舍：回溯引擎，病态模式可能慢（UI 有后台扫描+防抖兜底）。
fancy-regex = "0.16"
iced = { version = "0.14", default-features = false, features = [
    # P41 内存取舍（用户裁决「可妥协」）：tiny-skia 软渲染为唯一后端，
    # wgpu/GPU 驱动整树出局——GUI 进程内存的最大头（基线实测见 §2 P41）。
    # 代价：无 GPU 加速，滚动/打字帧走 CPU 栅化；如需恢复 GPU 渲染，
    # 把 features 改回 ["advanced", "crisp", "thread-pool"]（默认含 wgpu）。
    # ⚠️ thread-pool 必须保留：Task::perform 的执行器，丢了全部后台任务瘫痪。
    # 注：官方 image feature 未启用——其链路（iced_graphics/image）硬依赖
    # kamadak-exif 与 image 默认特性（gif→color_quant），离线环境拉不到；
    # 标签栏 Logo（P76）改为自研像素 quad 渲染（零依赖，见 view.rs AppLogo）。
    "tiny-skia", "advanced", "crisp", "thread-pool",
] }
rfd = "0.15"

[profile.release]
lto = "thin"
# Phase 0 增补：体积/性能。codegen-units=1 让 thin LTO 更有效；strip 去符号。
# ⚠️ 刻意不加 panic = "abort"：app 层多处 catch_unwind 兜底（加载/查找扫描/
# 高亮铺路保证「必然回一条消息」，见 main.rs 注释），abort 会击穿该语义。
codegen-units = 1
strip = "symbols"

# Phase 0 clippy 纪律：默认集（clippy::all）已本地清零，CI 以 -D warnings 阻断。
# 豁免项为既定风格取舍（改代码不如改纪律，均可在今后逐处收紧）：
# * field_reassign_with_default：本项目（尤其测试脚手架）惯用
#   Default::default() + 逐字段赋值摆夹具，改结构体字面量反而冗长。
[workspace.lints]
clippy.field_reassign_with_default = "allow"

# P117：vendor iced_tiny_skia 0.14 并最小修补——禁用其「部分损伤呈现」
# （损伤计算与 softbuffer 复用缓冲失步，选区带等 quad 只上屏顶部 1px、
# 其余停留旧帧；详见 vendor 内 compositor.rs 的 P117 注记）。待上游定位
# 根因后可移除本补丁。
[patch.crates-io]
iced_tiny_skia = { path = "vendor/iced_tiny_skia" }
