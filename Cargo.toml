[workspace]
resolver = "2"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
editpad-core = { path = "crates/core" }
ropey = "1.6"
encoding_rs = "0.8"
thiserror = "2"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "6"
# P70 正则查找/替换：fancy-regex（已在依赖树：syntect default-fancy）。
# 相比 regex 门面额外支持环视/反向引用（主流编辑器级能力）。
# 取舍：回溯引擎，病态模式可能慢（UI 有后台扫描+防抖兜底）。
fancy-regex = "0.16"
iced = { version = "0.14", default-features = false, features = [
    # P41 内存取舍（用户裁决「可妥协」）：tiny-skia 软渲染为唯一后端，
    # wgpu/GPU 驱动整树出局——GUI 进程内存的最大头（基线实测见 §2 P41）。
    # 代价：无 GPU 加速，滚动/打字帧走 CPU 栅化；如需恢复 GPU 渲染，
    # 把 features 改回 ["advanced", "crisp", "thread-pool"]（默认含 wgpu）。
    # ⚠️ thread-pool 必须保留：Task::perform 的执行器，丢了全部后台任务瘫痪。
    # 注：官方 image feature 未启用——其链路（iced_graphics/image）硬依赖
    # kamadak-exif 与 image 默认特性（gif→color_quant），离线环境拉不到；
    # 标签栏 Logo（P76）改为自研像素 quad 渲染（零依赖，见 view.rs AppLogo）。
    "tiny-skia", "advanced", "crisp", "thread-pool",
] }
rfd = "0.15"

[profile.release]
lto = "thin"
