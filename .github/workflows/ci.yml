# Editpad CI：test / release 阻断性；clippy 阻断（本地基线已清零）；fmt 信息性。
#
# ⚠️ fmt 作业暂为 continue-on-error：仓库有数百处格式偏差（2026-09-11 本机实测
# `cargo fmt --all -- --check` 报 675 个 hunk；rustfmt.toml 仅设 max_width=100，
# 即默认风格，偏差来自手写紧凑写法），刻意不在单轮全量格式化——分模块逐批收敛
# 后再接入阻断。
#
# clippy 用 `-D warnings`：Phase 0 已本地清零（rustfmt/clippy 组件已装齐）。
# 注意 channel = "stable" 漂移可能引入新 lint——届时按 CI 红修即可。

name: ci

on:
  push:
  pull_request:

# 连续推送时取消同一分支上尚未跑完的旧作业：依赖树（iced/syntect）编译
# 耗时占大头，排队跑已被取代的提交没有意义。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (workspace)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # 缓存 target/ 与 cargo 注册表：全量编译 iced + syntect 是 CI 的
      # 主要耗时，无缓存时每次 push 都要重来一遍。
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  release-build:
    name: release build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --workspace

  clippy:
    name: clippy (-D warnings)
    # 与 test 同平台：Windows 专属代码（kernel32 FFI、资源编译等 cfg 门控
    # 路径）此前在 ubuntu 上被整体跳过，从未被 lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  fmt:
    name: fmt (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check