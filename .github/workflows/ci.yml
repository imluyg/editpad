# Editpad CI：test / release 阻断性；clippy 阻断（本地基线已清零）；fmt 信息性。
#
# ⚠️ fmt 作业暂为 continue-on-error：仓库有数百处格式偏差（2026-09-24 本机实测
# `cargo fmt --all -- --check` 报 733 个 hunk；rustfmt.toml 仅设 max_width=100，
# 即默认风格，偏差来自手写紧凑写法），刻意不在单轮全量格式化——分模块逐批收敛
# 后再接入阻断。
#
# clippy 用 `-D warnings`：Phase 0 已本地清零（rustfmt/clippy 组件已装齐）。
# 注意 channel = "stable" 漂移可能引入新 lint——届时按 CI 红修即可。

name: ci

on:
  push:
  pull_request:

# 连续推送时取消同一分支上尚未跑完的旧作业：依赖树（iced/syntect）编译
# 耗时占大头，排队跑已被取代的提交没有意义。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：三个作业都只读仓库（CI 不发布、不打 tag、不推任何东西），而
# GITHUB_TOKEN 的默认作用域是写——第三方 action（checkout / rust-toolchain /
# rust-cache）因此也一并拿得到写权限。顶层显式收窄。
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (workspace)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # 缓存 target/ 与 cargo 注册表：全量编译 iced + syntect 是 CI 的
      # 主要耗时，无缓存时每次 push 都要重来一遍。
      - uses: Swatinem/rust-cache@v2
      # --locked：Cargo.lock 与清单不一致时直接失败。本仓带一处手工 vendor 补丁
      # （[patch.crates-io] iced_tiny_skia），补丁被解析器绕过时 cargo 只给一条
      # warning（P117/P119/P120 的选区残线/层栈修复会静默回归）——固定解析 +
      # 锁断言是唯一能提前发现的机制。本机 `cargo metadata --locked` 已验证
      # 锁与清单同步，加上它不会把 CI 弄红。
      - run: cargo test --locked --workspace
      # E-6：断言 vendor 补丁真的被命中。[patch.crates-io] 指向
      # vendor/iced_tiny_skia，命中时 Cargo.lock 里该包**没有** source 行；
      # 一旦解析走到上游（版本线前进 / 锁丢失后重解析），cargo 只输出一条
      # "patch not used" warning、作业照样绿——P117/P119/P120 修的选区残线与
      # 层栈只进不出会静默回归。正负两侧本机实测过：当前 lock 无 source 行
      # （断言放行），人为塞一行 source 即被检出（断言拦下）。
      - name: assert vendor patch is in effect
        shell: bash
        run: |
          if grep -A3 'name = "iced_tiny_skia"' Cargo.lock | grep -q '^source = '; then
            echo "::error::iced_tiny_skia 解析到了上游而非 vendor/ 补丁——渲染层修复会静默回归，请检查 Cargo.lock 与 [patch.crates-io]"
            exit 1
          fi
          echo "vendor iced_tiny_skia 补丁命中（lock 中无 source 行）"

  release-build:
    name: release build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --release --workspace

  clippy:
    name: clippy (-D warnings)
    # 与 test 同平台：Windows 专属代码（kernel32 FFI、资源编译等 cfg 门控
    # 路径）此前在 ubuntu 上被整体跳过，从未被 lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  fmt:
    name: fmt (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check