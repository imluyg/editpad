[package]
name = "editpad"
description = "Editpad 轻量文本编辑器 GUI 壳（iced）"
version.workspace = true
edition.workspace = true
license.workspace = true
# P71：图标与版本信息经 build.rs 调 Windows SDK rc.exe 编进资源段
build = "build.rs"

[[bin]]
name = "editpad"
path = "src/main.rs"

[dependencies]
iced.workspace = true
rfd.workspace = true
editpad-core.workspace = true
# 第 63 轮 F5 插入日期时间：曾尝试直连 time+local-offset 特性——该特性
# 会拉新的可选依赖 num_threads，离线环境（SSL 代理限制）无法解析，
# 故改为 core 层直接 FFI kernel32!GetLocalTime（见 editor/core.rs）。

# 仅测试用：headless 像素级渲染实验（P46 字形截断定位）——
# 与 iced 主依赖同版本，不进入发布构建
[dev-dependencies]
iced_tiny_skia = "0.14"
iced_graphics = "0.14"
tiny-skia = "0.11.4"

[lints]
workspace = true
